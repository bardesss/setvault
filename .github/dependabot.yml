# Weekly dependency update PRs. Minor/patch bumps are grouped per ecosystem
# so the queue stays small; majors arrive as their own PRs for a closer look.
# Security updates (enabled in repo settings) are raised as they're published,
# independent of this schedule.
version: 2
updates:
  # Python uv workspace (apps/web, apps/worker, packages/*) via the root uv.lock.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]
      python-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]

  # Base images of the all-in-one image (node build stage, python runtime).
  - package-ecosystem: "docker"
    directory: "/infra/docker"
    schedule:
      interval: "weekly"
      day: "monday"
    ignore:
      # Python minor upgrades are a deliberate move (wheels for every
      # dependency, e.g. lxml, must exist first); only take patch bumps.
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    commit-message:
      prefix: "chore"
      include: "scope"
