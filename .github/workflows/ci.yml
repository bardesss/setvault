name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  python:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18-alpine
        env: { POSTGRES_USER: setvault, POSTGRES_PASSWORD: setvault, POSTGRES_DB: setvault }
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U setvault" --health-interval=5s --health-retries=10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping" --health-interval=5s --health-retries=10
    steps:
      - uses: actions/checkout@v7
      - name: Install audio tools (ffmpeg, audiowaveform, chromaprint)
        run: |
          sudo add-apt-repository -y ppa:chris-needham/ppa
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg audiowaveform libchromaprint-tools
          ffmpeg -version | head -1
          audiowaveform --version
          fpcalc -version
      # pg_dump must be at least the server's major version (postgres:18 above);
      # the runner ships an older client.
      - name: Install PostgreSQL 18 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-18
          echo /usr/lib/postgresql/18/bin >> "$GITHUB_PATH"
          /usr/lib/postgresql/18/bin/pg_dump --version
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --all-extras --all-groups
      - run: uv run ruff check .
      - run: uv run alembic upgrade head
      - run: uv run pytest -q
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://setvault:setvault@localhost:5432/setvault
          REDIS_URL: redis://localhost:6379/0
          # Audio pipeline tests fail instead of skipping if a tool is missing.
          SETVAULT_REQUIRE_AUDIO_TOOLS: "1"

  frontend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18-alpine
        env: { POSTGRES_USER: setvault, POSTGRES_PASSWORD: setvault, POSTGRES_DB: setvault }
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U setvault" --health-interval=5s --health-retries=10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping" --health-interval=5s --health-retries=10
    env:
      DATABASE_URL: postgresql+asyncpg://setvault:setvault@localhost:5432/setvault
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-secret-key-for-e2e-only-base64-padded-padded-padded
      BASE_URL: http://localhost:1970
      SETVAULT_DEV_SEED: "1"
      SETVAULT_ALLOW_INSECURE_COOKIE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --all-extras --all-groups
      - run: uv run alembic upgrade head
      - name: Start backend
        run: |
          uv run uvicorn setvault_web.main:app --host 127.0.0.1 --port 1970 \
            >uvicorn.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:1970/api/health >/dev/null; then
              echo "backend ready"; exit 0
            fi
            sleep 1
          done
          echo "backend never came up"; cat uvicorn.log; exit 1
      - run: npm ci
        working-directory: frontend
      - run: npm run check
        working-directory: frontend
      - run: npm run test:unit -- --run
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - name: Upload backend log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with: { name: uvicorn-log, path: uvicorn.log, if-no-files-found: ignore }
