[project]
name = "setvault-web"
version = "0.23.0"
requires-python = ">=3.12"
dependencies = [
  "setvault-core",
  "setvault-providers",
  "setvault-ingest-sources",
  "fastapi>=0.143.3",
  "uvicorn[standard]>=0.54.0",
  "pydantic-settings>=2.16.0",
  "rq>=1.16",
  "redis>=8.1.0",
  "rq-scheduler>=0.13",
  "python-magic>=0.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "httpx>=0.27", "respx>=0.21"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/setvault_web"]
