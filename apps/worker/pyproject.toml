[project]
name = "setvault-worker"
version = "0.25.1"
requires-python = ">=3.12"
dependencies = [
  "setvault-core",
  "setvault-ingest-sources",
  "rq>=1.16",
  "redis>=8.1.0",
  "rq-scheduler>=0.13",
]

[project.optional-dependencies]
dev = ["pytest>=9.1.1", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/setvault_worker"]
