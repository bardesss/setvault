[project]
name = "setvault-core"
version = "0.26.0"
requires-python = ">=3.12"
dependencies = [
  "setvault-providers",
  "sqlalchemy[asyncio]>=2.1.6",
  "asyncpg>=0.29",
  "alembic>=1.20.1",
  "pydantic>=2.7",
  "argon2-cffi>=23.1",
  "itsdangerous>=2.2",
  "email-validator>=2.1",
  "feedgen>=1.0.0",
  "cryptography>=50.0.2",
  "rq>=1.16",
  "redis>=8.1.0",
  "structlog>=26.1.0",
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "pytesseract>=0.3.10",
  "pillow>=13.0.0",
  "bleach>=6.1",
  "markdown>=3.6",
  # Pinned exactly; bump via infra/scripts/update-yt-dlp.sh after a monthly
  # release-extractor check or when a user reports a URL-rip regression.
  # [default] brings yt-dlp-ejs, the YouTube JS-challenge solver (run by the
  # image's Deno).
  "yt-dlp[default]==2026.10.21",
  # yt-dlp plugin fetching YouTube PO tokens from the bgutil server the image
  # runs on 127.0.0.1:4416. Keep in step with BGUTIL_VERSION in the Dockerfile.
  "bgutil-ytdlp-pot-provider==2.0.2",
  "watchdog>=4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "defusedxml>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/setvault_core"]
